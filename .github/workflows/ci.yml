name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Ask the active Xcode which destinations it can actually build for,
          # rather than guessing from installed runtimes (the runner image
          # carries several Xcodes). Takes the newest-OS iPhone it lists.
          xcodebuild -project Crosstalk.xcodeproj -scheme Crosstalk -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" | grep "name:iPhone" > destinations.txt || true
          cat destinations.txt
          UDID=$(while IFS= read -r line; do
              os=$(printf '%s' "$line" | sed -nE 's/.*OS:([0-9.]+).*/\1/p')
              id=$(printf '%s' "$line" | sed -nE 's/.*id:([A-Fa-f0-9-]{36}).*/\1/p')
              if [ -n "$os" ] && [ -n "$id" ]; then echo "$os $id"; fi
            done < destinations.txt | sort -V -r | head -1 | cut -d' ' -f2)
          if [ -z "$UDID" ]; then echo "No iPhone simulator destination found"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $UDID"

      - name: Build and run tests
        env:
          # Passed into the test process as SNAPSHOT_DIR.
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project Crosstalk.xcodeproj \
            -scheme Crosstalk \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload screen snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-snapshots
          path: snapshots/
          if-no-files-found: ignore
