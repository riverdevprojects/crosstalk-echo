name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Prefer the destinations the active Xcode says it can build for
          # (the runner image carries several Xcodes). If that lists nothing,
          # fall back to the newest available iPhone simulator runtime.
          xcodebuild -project Crosstalk.xcodeproj -scheme Crosstalk -showdestinations > showdestinations.txt 2>&1 || true
          grep "platform:iOS Simulator" showdestinations.txt | grep "name:iPhone" > destinations.txt || true
          echo "--- xcodebuild -showdestinations (iPhone simulators)"; cat destinations.txt
          UDID=$(while IFS= read -r line; do
              os=$(printf '%s' "$line" | sed -nE 's/.*OS:([0-9.]+).*/\1/p')
              id=$(printf '%s' "$line" | sed -nE 's/.*id:([A-Fa-f0-9-]{36}).*/\1/p')
              if [ -n "$os" ] && [ -n "$id" ]; then echo "$os $id"; fi
            done < destinations.txt | sort -V -r | head -1 | cut -d' ' -f2)
          if [ -z "$UDID" ]; then
            echo "--- no destinations from xcodebuild; its output was:"; tail -20 showdestinations.txt
            UDID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-([\d-]+)$", runtime)
              return tuple(int(p) for p in m.group(1).split("-")) if m else ()
          for runtime in sorted(devices, key=version, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          fi
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $UDID"

      - name: Build and run tests
        env:
          # Passed into the test process as SNAPSHOT_DIR.
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project Crosstalk.xcodeproj \
            -scheme Crosstalk \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload screen snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-snapshots
          path: snapshots/
          if-no-files-found: ignore
